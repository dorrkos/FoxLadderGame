<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간 떨어지는 홍보 알바: 구미호 아파트</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
            color: white;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #2c2c2c;
            background-image: url("오브젝트(Obj)/게임 화면.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            overflow: hidden;
            box-shadow: none;
        }

        /* 배경 질감 (복도 느낌) */
        #game-container::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.1) 40px, rgba(0,0,0,0.1) 80px);
            pointer-events: none;
        }

        /* 메인 메뉴에서는 배경 질감(어두운 막) 숨김 */
        #game-container.no-texture::before {
            content: none;
        }

        .platform {
            position: absolute;
            height: 15px;
            background-color: #111;
            width: 100%;
            border-top: 2px solid #444;
        }

        .ladder {
            position: absolute;
            width: 40px;
            z-index: 4;
            background: transparent;
            border: none;
        }

        .ladder-step {
            height: 3px;
            background-color: #3d2b1f;
            width: 100%;
            margin-top: 12px;
        }

        .elevator {
            position: absolute;
            width: 50px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            background: transparent;
            border: 2px solid #2196f3;
            box-shadow: none;
        }

        .elevator img {
            width: 50px;
            height: 70px;
            object-fit: contain;
            display: block;
        }
        
        /* Cooldown 상태여도 반투명/필터 효과는 적용하지 않음 (이미지 교체로만 표현) */
        .elevator.cooldown { opacity: 1; filter: none; }

        .door {
            position: absolute;
            width: 45px;
            height: 65px;
            background-color: #3d0000;
            border: 3px solid #8b0000;
            z-index: 2;
        }

        .enemy {
            position: absolute;
            width: 36px;
            height: 48px;
            border-radius: 4px;
            z-index: 8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            font-size: 10px;
            transition: opacity 0.3s, background-color 0.3s;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .enemy.silhouette { background-color: transparent !important; color: transparent !important; opacity: 0.9; }
        .enemy.silhouette img { filter: grayscale(1) brightness(0.6); opacity: 0.9; }
        .enemy.revealed { opacity: 0.6; }
        .enemy.active { opacity: 1; }

        .flyer {
            position: absolute;
            width: 25px;
            height: 35px;
            background-color: #fffde7;
            border: 1px solid #d4d4d4;
            transform: rotate(-5deg);
            z-index: 5;
            box-shadow: 2px 2px 2px rgba(0,0,0,0.3);
        }

        .flyer.collected {
            background-color: #ff5252 !important;
            border-color: #b71c1c;
            transform: scale(0.9) rotate(5deg);
        }

        #player {
            position: absolute;
            width: 35px;
            height: 45px;
            border-radius: 4px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            border: none;
        }
        #player.dead { opacity: 0.5; filter: grayscale(1); }

        /* UI 영역 */
        #ui {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 20;
            pointer-events: none;
        }

        .stat-badge {
            background: rgba(0,0,0,0.7);
            padding: 5px 15px;
            border-radius: 5px;
            border: 1px solid #555;
            font-size: 14px;
        }

        /* 로그라이크 선택 화면 */
        #perk-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none; /* 기본 숨김, showPerkSelection()로 노출 */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #perk-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .perk-card {
            width: 180px;
            height: 260px;
            background: #2c2c2c;
            border: 3px solid #ffd700;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            position: relative;
        }

        .perk-card:hover {
            transform: translateY(-10px);
            background: #3d3d3d;
        }

        .perk-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #ffd700; }
        .perk-desc { font-size: 14px; color: #ccc; line-height: 1.5; flex-grow: 1; }
        .perk-value { font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 10px; }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 2px solid #8b0000;
            padding: 40px;
            text-align: center;
            z-index: 100;
            display: none;
        }

        button {
            background: #8b0000;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        .img-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1700;
            background: rgba(0,0,0,0.92);
            flex-direction: column;
        }

        .img-overlay.clickable { cursor: pointer; }

        .img-overlay img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .overlay-skip-hint {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 18px;
            text-align: center;
            font-size: 16px;
            letter-spacing: 0.5px;
            opacity: 0.85;
            pointer-events: none;
            user-select: none;
        }

        .overlay-bottom-actions {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 28px;
            display: flex;
            justify-content: center;
            gap: 12px;
            pointer-events: auto;
        }

        /* MISS 텍스트 (회피 성공 시) */
        .miss-text {
            position: absolute;
            z-index: 50;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            opacity: 0;
            transform: translate(-50%, 0);
            pointer-events: none;
            user-select: none;
            animation: miss-float 700ms ease-out forwards;
        }

        @keyframes miss-float {
            0% { opacity: 0; transform: translate(-50%, 6px); }
            15% { opacity: 1; transform: translate(-50%, 0px); }
            100% { opacity: 0; transform: translate(-50%, -22px); }
        }

        /* 목표 안내(전단지 11장 수집 후) */
        .goal-hint {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 40;
            display: none;
            font-size: 22px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 2px 6px rgba(0,0,0,0.7);
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- Audio (BGM/SE) -->
    <div id="audio-root" style="display:none">
        <audio id="bgm-lobby" src="사운드/BGM-lobby.mp3" loop preload="auto" autoplay></audio>
        <audio id="bgm-game" src="사운드/BGM-gamebgm.mp3" loop preload="auto"></audio>
        <audio id="bgm-gameover" src="사운드/BGM-gameover.mp3" loop preload="auto"></audio>
        <audio id="se-chack" src="사운드/SE-chack.mp3" preload="auto"></audio>
        <audio id="se-ding" src="사운드/SE-ding.mp3" preload="auto"></audio>
        <audio id="se-ladder" src="사운드/SE-ladder.mp3" preload="auto"></audio>
        <audio id="se-respawn" src="사운드/SE-respawn.mp3" preload="auto"></audio>
        <audio id="bgm-ending" src="사운드/BGM_ending.wav" loop preload="auto"></audio>
        <audio id="se-clear" src="사운드/SE_clear.mp3" preload="auto"></audio>
        <audio id="se-gotya" src="사운드/SE_gotya.mp3" preload="auto"></audio>
    </div>

    <div id="game-container" class="no-texture">
        <div id="ui">
            <div style="display:flex;gap:10px;align-items:center;">
                <div class="stat-badge" id="score-display">전단지: 0 / 11</div>
                <div class="stat-badge" id="level-display">Lv. 1</div>
            </div>
            <div class="stat-badge" id="player-stats">이속: 1.0 | 회피: 0%</div>
            <div class="stat-badge" id="lives-display">목숨: 9 / 9</div>
        </div>

        <div id="goal-hint" class="goal-hint">최상층까지 올라가세요!</div>

        <!-- 6층 구조물 -->
        <div class="platform" style="bottom: 0;"></div>
        <div class="platform" style="bottom: 100px;"></div>
        <div class="platform" style="bottom: 200px;"></div>
        <div class="platform" style="bottom: 300px;"></div>
        <div class="platform" style="bottom: 400px;"></div>
        <div class="platform" style="bottom: 500px;"></div>

        <div id="ladders-container"></div>
        <div id="doors-container"></div>
        <div id="elevators-container"></div>
        <div id="flyers-container"></div>
        <div id="enemies-container"></div>

        
        <div id="player">🏃</div>

        <!-- 로그라이크 선택창 -->
        <div id="perk-overlay">
            <h1 style="color: #ffd700;">강화 선택</h1>
            <p>구미호의 아파트에 들어가기 전, 능력을 하나 선택하세요.</p>
            <div id="perk-container"></div>
        </div>

        <!-- 로딩 오버레이 (애셋 프리로드용, 기본 숨김) -->
        <div id="loading-overlay" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:1500;background:rgba(0,0,0,0.9);color:#ffd700;font-size:24px;">
            로딩 중... 잠시만 기다려 주세요.
        </div>
        <div id="message">
            <h1 id="msg-text">미션 클리어!</h1>
            <button onclick="resetGame()">다시 알바하기</button>
        </div>

        <!-- 게임 오버 오버레이 (window_gameover + 돌아가기 버튼) -->
        <div id="gameover-overlay" class="img-overlay">
            <img src="오브젝트(Obj)/window_gameover.png" alt="gameover" draggable="false" />
            <div class="overlay-bottom-actions">
                <button onclick="returnToMainMenu()">돌아가기</button>
            </div>
        </div>

        <!-- 레벨 클리어 오버레이 (window_clear + 다음으로 버튼) -->
        <div id="clear-overlay" class="img-overlay">
            <img src="오브젝트(Obj)/window_clear.png" alt="clear" draggable="false" />
            <div class="overlay-bottom-actions">
                <button onclick="onClearNext()">다음으로</button>
            </div>
        </div>

        <!-- 엔딩 오버레이 (window_ending, 클릭하면 메인으로) -->
        <div id="ending-overlay" class="img-overlay clickable" onclick="finishEnding()">
            <img src="오브젝트(Obj)/window_ending.png" alt="ending" draggable="false" />
            <div class="overlay-skip-hint">클릭하여 넘어가기</div>
        </div>
        
            <!-- 메인 메뉴 오버레이 -->
            <div id="main-menu" style="position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;z-index:1500;background-image:url('오브젝트(Obj)/메인화면.png');background-size:cover;background-position:center;background-repeat:no-repeat;">
                <div style="display:flex;gap:12px;justify-content:center;width:100%;padding:0 0 28px 0;">
                    <button onclick="startGameFromMenu()">게임 시작</button>
                    <button onclick="showInstructions()">플레이 방법</button>
                </div>
            </div>

            <!-- 컷씬 오버레이 (window_intro, 클릭하면 다음) -->
            <div id="cutscene-overlay" class="img-overlay clickable" style="z-index:1600;background:rgba(0,0,0,0.95);" onclick="finishIntroCutscene()">
                <img src="오브젝트(Obj)/window_intro.png" alt="intro" draggable="false" />
                <div class="overlay-skip-hint">클릭하여 넘어가기</div>
            </div>
    </div>

<script>
    const CONFIG = {
        width: 800,
        height: 600,
        floorHeight: 100,
        playerWidth: 35,
        playerHeight: 45,
        totalFlyers: 11,
        totalDoors: 8,
        maxStage: 9,
        friction: 0.9,
        baseMoveAmount: 0.30,
        baseRespawnTime: 3.0,
        baseEvasion: 0
    };

    let gameState = {
        x: 100,
        y: 0,
        playerXVel: 0,
        currentFloor: 0,
        stage: 1,
        stageCleared: false,
        score: 0,
        keys: {},
        ladders: [],
        flyers: [],
        doors: [],
        enemies: [],
        elevators: {},
        isClimbing: false,
        isDead: false,
        isPaused: true,
        moveMultiplier: 1.0,
        evasionRate: 0,
        respawnTime: CONFIG.baseRespawnTime,
        elevatorCooldownActive: false,
        climbTargetY: null,
        climbStartY: null,
        climbStartTime: null
        ,
        // catch state when player is grabbed by an enemy
        caughtByEnemy: false,
        caughtAt: null,
        caughtTimeoutId: null,
        activeTimeouts: [],
        respawnTimeoutId: null,
        // player animation state
        playerAnim: 'idle',
        playerAnimFrame: 0,
        playerAnimTimer: Date.now(),

        // lives system
        lives: 9,
        maxLives: 9,
        isGameOver: false,

        // enemy id sequence for per-enemy effects
        enemySeq: 0
    };

    const containerEl = {
        ladder: document.getElementById('ladders-container'),
        door: document.getElementById('doors-container'),
        enemy: document.getElementById('enemies-container'),
        flyer: document.getElementById('flyers-container'),
        elevator: document.getElementById('elevators-container'),
        player: document.getElementById('player'),
        goalHint: document.getElementById('goal-hint'),
        perkOverlay: document.getElementById('perk-overlay'),
        perkContainer: document.getElementById('perk-container'),
        uiStats: document.getElementById('player-stats')
    };

    const sound = (() => {
        const el = {
            bgmLobby: document.getElementById('bgm-lobby'),
            bgmGame: document.getElementById('bgm-game'),
            bgmGameover: document.getElementById('bgm-gameover'),
            bgmEnding: document.getElementById('bgm-ending'),
            seChack: document.getElementById('se-chack'),
            seDing: document.getElementById('se-ding'),
            seLadder: document.getElementById('se-ladder'),
            seRespawn: document.getElementById('se-respawn'),
            seClear: document.getElementById('se-clear'),
            seGotya: document.getElementById('se-gotya')
        };

        let desiredBgm = 'lobby'; // 'lobby' | 'game' | 'gameover' | 'ending'

        function playSafe(audio, { resetTime = false, volume } = {}) {
            if (!audio) return;
            try {
                if (typeof volume === 'number') audio.volume = volume;
                if (resetTime) audio.currentTime = 0;
                const p = audio.play();
                if (p && typeof p.catch === 'function') p.catch(() => {});
            } catch (_) {}
        }

        function stopSafe(audio) {
            if (!audio) return;
            try { audio.pause(); } catch (_) {}
            try { audio.currentTime = 0; } catch (_) {}
        }

        return {
            playBgmLobby() {
                desiredBgm = 'lobby';
                stopSafe(el.bgmGame);
                stopSafe(el.bgmGameover);
                stopSafe(el.bgmEnding);
                if (el.bgmLobby && !el.bgmLobby.paused) return;
                playSafe(el.bgmLobby, { resetTime: true, volume: 0.7 });
            },
            playBgmGame() {
                desiredBgm = 'game';
                stopSafe(el.bgmLobby);
                stopSafe(el.bgmGameover);
                stopSafe(el.bgmEnding);
                if (el.bgmGame && !el.bgmGame.paused) return;
                playSafe(el.bgmGame, { resetTime: true, volume: 0.7 });
            },
            playBgmGameover() {
                desiredBgm = 'gameover';
                stopSafe(el.bgmLobby);
                stopSafe(el.bgmGame);
                stopSafe(el.bgmEnding);
                if (el.bgmGameover && !el.bgmGameover.paused) return;
                playSafe(el.bgmGameover, { resetTime: true, volume: 0.75 });
            },
            playBgmEnding() {
                desiredBgm = 'ending';
                stopSafe(el.bgmLobby);
                stopSafe(el.bgmGame);
                stopSafe(el.bgmGameover);
                if (el.bgmEnding && !el.bgmEnding.paused) return;
                playSafe(el.bgmEnding, { resetTime: true, volume: 0.75 });
            },
            stopAllBgm() {
                stopSafe(el.bgmLobby);
                stopSafe(el.bgmGame);
                stopSafe(el.bgmGameover);
                stopSafe(el.bgmEnding);
            },
            ensureDesiredBgm() {
                // Autoplay 제한으로 인해 play()가 막힌 경우, 유저 입력 시 '현재 의도된 BGM'만 재생 시도
                try {
                    if (desiredBgm === 'lobby') {
                        stopSafe(el.bgmGame);
                        stopSafe(el.bgmGameover);
                        stopSafe(el.bgmEnding);
                        if (el.bgmLobby && el.bgmLobby.paused) playSafe(el.bgmLobby, { resetTime: false, volume: 0.7 });
                    } else if (desiredBgm === 'game') {
                        stopSafe(el.bgmLobby);
                        stopSafe(el.bgmGameover);
                        stopSafe(el.bgmEnding);
                        if (el.bgmGame && el.bgmGame.paused) playSafe(el.bgmGame, { resetTime: false, volume: 0.7 });
                    } else if (desiredBgm === 'gameover') {
                        stopSafe(el.bgmLobby);
                        stopSafe(el.bgmGame);
                        stopSafe(el.bgmEnding);
                        if (el.bgmGameover && el.bgmGameover.paused) playSafe(el.bgmGameover, { resetTime: false, volume: 0.75 });
                    } else if (desiredBgm === 'ending') {
                        stopSafe(el.bgmLobby);
                        stopSafe(el.bgmGame);
                        stopSafe(el.bgmGameover);
                        if (el.bgmEnding && el.bgmEnding.paused) playSafe(el.bgmEnding, { resetTime: false, volume: 0.75 });
                    }
                } catch (_) {}
            },
            playSeChack() { playSafe(el.seChack, { resetTime: true }); },
            playSeDing() { playSafe(el.seDing, { resetTime: true }); },
            playSeLadder() { playSafe(el.seLadder, { resetTime: true }); },
            playSeRespawn() { playSafe(el.seRespawn, { resetTime: true }); },
            playSeClear() { playSafe(el.seClear, { resetTime: true }); },
            playSeGotya() { playSafe(el.seGotya, { resetTime: true }); }
        };
    })();

    // Autoplay 제한 대응: 로드 시도 + 첫 유저 입력에서 오디오 언락
    (function setupAudioUnlock() {
        function unlock() {
            // best-effort: 유저 입력 시점에 '의도된 BGM'만 재생 시도
            sound.ensureDesiredBgm();
        }
        // load 시도 (자동재생이 허용된 환경이면 즉시 재생)
        try {
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                unlock();
            } else {
                window.addEventListener('DOMContentLoaded', unlock, { once: true });
            }
        } catch (_) {}
        // user gesture 시 확실히 재생되도록
        window.addEventListener('pointerdown', unlock, { once: true });
        window.addEventListener('keydown', unlock, { once: true });
    })();

    // Helper: schedule timeouts and track them so we can clear on reset
    function scheduleTimeout(fn, ms) {
        const id = setTimeout(() => {
            // remove from tracking when executed
            const idx = gameState.activeTimeouts.indexOf(id);
            if (idx !== -1) gameState.activeTimeouts.splice(idx, 1);
            fn();
        }, ms);
        gameState.activeTimeouts.push(id);
        return id;
    }

    function clearScheduledTimeouts() {
        if (!gameState.activeTimeouts) return;
        gameState.activeTimeouts.forEach(id => clearTimeout(id));
        gameState.activeTimeouts = [];
    }

    // Safely create an <img> element with onerror fallback
    function safeCreateImage(src, w, h, fallbackText) {
        const img = document.createElement('img');
        img.src = src;
        if (w) img.style.width = w + 'px';
        if (h) img.style.height = h + 'px';
        img.style.display = 'block';
        img.onerror = () => {
            // replace image with simple fallback visual
            const parent = img.parentElement;
            if (!parent) return;
            const fallback = document.createElement('div');
            fallback.className = 'img-fallback';
            fallback.style.width = (w || 36) + 'px';
            fallback.style.height = (h || 48) + 'px';
            fallback.style.background = '#333';
            fallback.style.color = '#fff';
            fallback.style.display = 'flex';
            fallback.style.alignItems = 'center';
            fallback.style.justifyContent = 'center';
            fallback.style.fontSize = '10px';
            fallback.innerText = fallbackText || '이미지';
            parent.replaceChild(fallback, img);
        };
        return img;
    }

    // 실제 폴더의 프레임 수에 맞춘 애니메이션 메타 정보
    const ENEMY_ANIM_INFO = {
        '루나': { walk:{count:5,prefix:'루나(luna)/luna_walk',dur:120}, ladder:{count:3,prefix:'루나(luna)/luna_ladder',dur:160}, catch:{count:1,prefix:'루나(luna)/luna_catch',dur:2000} },
        '미나미': { walk:{count:5,prefix:'미나미(minami)/minami_walk',dur:120}, ladder:{count:1,prefix:'미나미(minami)/minami_ladder',dur:160}, catch:{count:1,prefix:'미나미(minami)/minami_catch',dur:2000} },
        '미아': { walk:{count:5,prefix:'미아(mia)/mia_walk',dur:120}, ladder:{count:2,prefix:'미아(mia)/mia_ladder',dur:160}, catch:{count:4,prefix:'미아(mia)/mia_scare',dur:2000} },
        '소미': { walk:{count:3,prefix:'소미(somi)/somi_walk',dur:120}, ladder:{count:1,prefix:'소미(somi)/somi_idle',dur:160}, catch:{count:1,prefix:'소미(somi)/somi_idle',dur:2000} },
        '시유키': { walk:{count:5,prefix:'시유키(shiyuki)/shiyuki_walk',dur:120}, ladder:{count:3,prefix:'시유키(shiyuki)/shiyuki_ladder',dur:160}, catch:{count:1,prefix:'시유키(shiyuki)/shiyuki_catch',dur:2000} },
        '타로': { walk:{count:0,prefix:'',dur:120}, ladder:{count:0,prefix:'',dur:160}, catch:{count:1,prefix:'타로(taro)/taro_catch',dur:2000}, fall:{count:2,prefix:'타로(taro)/taro_fall',dur:400} }
    };

    // 스테이지별 적 등장 풀
    const STAGE_ENEMY_POOL = {
        1: ['시유키'],
        2: ['시유키', '루나'],
        3: ['시유키', '미나미'],
        4: ['시유키', '타로', '미나미'],
        5: ['시유키', '타로', '소미', '미나미'],
        6: ['미나미', '루나', '소미', '타로'],
        7: ['미나미', '루나', '미아', '타로', '시유키'],
        8: ['시유키', '타로', '루나', '미아', '미나미', '소미'],
        9: ['시유키', '타로', '루나', '미아', '미나미', '소미']
    };

    function randMs(minMs, maxMs) {
        const min = Math.min(minMs, maxMs);
        const max = Math.max(minMs, maxMs);
        return min + Math.floor(Math.random() * (max - min + 1));
    }

    // 첫 스폰: 1/2 확률 0.5초, 아니면 3~12초
    function getInitialDoorSpawnDelayMs() {
        return Math.random() < 0.5 ? 500 : randMs(3000, 12000);
    }

    // 첫 스폰 이후: 스테이지(레벨) 구간별 간격
    function getPostFirstDoorSpawnDelayMs(stage) {
        const s = Math.max(1, Math.min(CONFIG.maxStage, stage || 1));
        if (s <= 3) return randMs(7000, 14000);
        if (s <= 6) return randMs(6000, 13000);
        return randMs(5000, 12000);
    }

    function getAllowedEnemyNamesForStage(stage) {
        const s = Math.max(1, Math.min(CONFIG.maxStage, stage || 1));
        return STAGE_ENEMY_POOL[s] || null;
    }

    // 스테이지별 문 개수
    // 1~2: 5개, 3~4: 6개, 5~6: 7개, 7~9: 8개
    function getDoorCountForStage(stage) {
        const s = Math.max(1, Math.min(CONFIG.maxStage, stage || 1));
        if (s <= 2) return 5;
        if (s <= 4) return 6;
        if (s <= 6) return 7;
        return 8;
    }

    // Preload common assets to avoid runtime frame drops and broken images
    function preloadAssets(onProgress) {
        const assets = [];
        // player
        assets.push('플레이어(Player)/Player_idle.png');
        for (let i=1;i<=5;i++) assets.push(`플레이어(Player)/Player_walk${i}.png`);
        for (let i=1;i<=3;i++) assets.push(`플레이어(Player)/Player_ladder${i}.png`);
        for (let i=1;i<=3;i++) assets.push(`플레이어(Player)/Player_over${i}.png`);
        // enemies (common prefixes)
        const types = ['루나(luna)/luna_', '미나미(minami)/minami_', '미아(mia)/mia_', '소미(somi)/somi_', '시유키(shiyuki)/shiyuki_', '타로(taro)/taro_'];
        types.forEach(t => {
            // try some common suffixes
            ['idle','walk1','walk2','walk3','walk4','walk5','ladder1','ladder2','ladder3','catch','fall1','fall2','scare1'].forEach(s => assets.push(t + s + (s.match(/\d$/)?'.png':'.png')));
        });

        // overlays
        assets.push('오브젝트(Obj)/window_intro.png');
        assets.push('오브젝트(Obj)/window_clear.png');
        assets.push('오브젝트(Obj)/window_ending.png');
        assets.push('오브젝트(Obj)/window_gameover.png');

        containerEl.player.innerHTML = ''; // clear while loading
        const total = assets.length;
        let loaded = 0;
        return new Promise(resolve => {
            if (total === 0) { resolve(); return; }
            assets.forEach(path => {
                const img = new Image();
                img.onload = () => { loaded++; if (onProgress) onProgress(loaded, total); if (loaded === total) resolve(); };
                img.onerror = () => { loaded++; if (onProgress) onProgress(loaded, total); if (loaded === total) resolve(); };
                img.src = path;
            });
            // safety timeout: resolve after 6s even if some assets fail
            scheduleTimeout(() => resolve(), 6000);
        });
    }

    function triggerStageClear() {

    function onClearNext() {
        const clear = document.getElementById('clear-overlay');
        if (clear) clear.style.display = 'none';

            showEnding();
            return;
        }

        gameState.stage = Math.min(CONFIG.maxStage, (gameState.stage || 1) + 1);
        resetMapForNextStage();
        showPerkSelection();
        gameState.stageCleared = false;

        const now = Date.now();
        gameState.doors.forEach(door => {
            door.nextSpawnAt = now + getInitialDoorSpawnDelayMs();

    function initLadders() {
        containerEl.ladder.innerHTML = '';
        gameState.ladders = [];
        for (let floor = 0; floor < 5; floor++) {
            const count = 3;
            for (let i = 0; i < count; i++) {
                // choose x with collision-avoidance against other ladders only
                let x;
                let attempts = 0;
                const minSpacing = 60; // px
                do {
                    x = 50 + Math.random() * (CONFIG.width - 100);
                    attempts++;
                    if (attempts > 200) break;
                } while (gameState.ladders.some(l => l.floor === floor && Math.abs(x - l.x) < minSpacing));

                const ladderObj = { x, floor, bottomY: floor * CONFIG.floorHeight, topY: (floor + 1) * CONFIG.floorHeight };
                gameState.ladders.push(ladderObj);
                // create ladder element and use object ladder image
                const ladderEl = document.createElement('div');
                ladderEl.className = 'ladder';
                ladderEl.style.left = x + 'px';
                ladderEl.style.bottom = (floor * CONFIG.floorHeight - 5) + 'px';
                ladderEl.style.height = (CONFIG.floorHeight + 20) + 'px';
                // append image inside ladder container for consistent sizing/position
                const ladderImg = safeCreateImage('오브젝트(Obj)/ladder.png', 40, CONFIG.floorHeight + 20, '사다리');
                ladderImg.style.width = '40px';
                ladderImg.style.height = (CONFIG.floorHeight + 20) + 'px';
                ladderEl.appendChild(ladderImg);
                containerEl.ladder.appendChild(ladderEl);
            }
        }
    }

    function initDoors() {
        containerEl.door.innerHTML = '';
        gameState.doors = [];
        const doorCount = getDoorCountForStage(gameState.stage);
        for (let i = 0; i < doorCount; i++) {
            const floor = Math.floor(Math.random() * 5) + 1;
            let x;
            let attempts = 0;
            const minSpacing = 60;
            do {
                x = 50 + Math.random() * (CONFIG.width - 100);
                attempts++;
                if (attempts > 200) break;
            } while (
                // same floor doors
                gameState.doors.some(d => d.floor === floor && Math.abs(x - d.x) < minSpacing) ||
                // avoid ladders that visually touch this floor (from below or above)
                gameState.ladders.some(l => (l.floor === floor || l.floor === (floor - 1)) && Math.abs(x - l.x) < minSpacing) ||
                // if elevators already exist, avoid elevators on this floor
                (gameState.elevators && (
                    (gameState.elevators.A && gameState.elevators.A.floor === floor && Math.abs(x - gameState.elevators.A.x) < minSpacing) ||
                    (gameState.elevators.B && gameState.elevators.B.floor === floor && Math.abs(x - gameState.elevators.B.x) < minSpacing)
                ))
            );
            // create door image element using door_1 as default
            const doorImg = safeCreateImage('오브젝트(Obj)/door_1.png', 45, 65, '문');
            doorImg.className = 'door';
            doorImg.style.position = 'absolute';
            doorImg.style.left = x + 'px';
            doorImg.style.bottom = (floor * CONFIG.floorHeight + 15) + 'px';
            doorImg.style.width = '45px';
            doorImg.style.height = '65px';
            containerEl.door.appendChild(doorImg);
            // schedule first spawn randomly between 5-12s
            const now = Date.now();
            const first = now + (5000 + Math.floor(Math.random() * 7000));
            gameState.doors.push({ x, floor, nextSpawnAt: first, el: doorImg });
        }
    }

    function initElevators() {
        containerEl.elevator.innerHTML = '';
        const floorA = Math.floor(Math.random() * 2) + 1;
        const floorB = Math.floor(Math.random() * 2) + 3;
        // pick two elevator x positions that don't collide with each other or existing doors
        let xA;
        let xB;
        let attempts = 0;
        const minSpacing = 120;
        do {
            xA = 50 + Math.random() * (CONFIG.width - 100);
            attempts++;
            if (attempts > 500) break;
        } while (
            (gameState.doors && gameState.doors.some(d => d.floor === floorA && Math.abs(xA - d.x) < 60)) ||
            (gameState.ladders && gameState.ladders.some(l => (l.floor === floorA || l.floor === (floorA - 1)) && Math.abs(xA - l.x) < 60))
        );
        attempts = 0;
        do {
            xB = 50 + Math.random() * (CONFIG.width - 100);
            attempts++;
            if (attempts > 500) break;
        } while (
            Math.abs(xB - xA) < minSpacing ||
            (gameState.doors && gameState.doors.some(d => d.floor === floorB && Math.abs(xB - d.x) < 60)) ||
            (gameState.ladders && gameState.ladders.some(l => (l.floor === floorB || l.floor === (floorB - 1)) && Math.abs(xB - l.x) < 60))
        );
        gameState.elevators = {
            A: { x: xA, y: floorA * CONFIG.floorHeight, floor: floorA, el: null, imgEl: null },
            B: { x: xB, y: floorB * CONFIG.floorHeight, floor: floorB, el: null, imgEl: null }
        };
        const createEl = (type, data) => {
            const el = document.createElement('div');
            el.className = `elevator`;
            el.innerText = '';
            el.style.left = data.x + 'px';
            el.style.bottom = (data.y + 15) + 'px';
            const img = safeCreateImage('오브젝트(Obj)/elevator_open.png', 50, 70, '엘리베이터');
            el.appendChild(img);
            containerEl.elevator.appendChild(el);
            gameState.elevators[type].el = el;
            gameState.elevators[type].imgEl = img;
        };
        createEl('A', gameState.elevators.A);
        createEl('B', gameState.elevators.B);
    }

    function setElevatorImages(isAvailable) {
        const src = isAvailable ? '오브젝트(Obj)/elevator_open.png' : '오브젝트(Obj)/elevator_close.png';
        ['A', 'B'].forEach(k => {
            const e = gameState.elevators && gameState.elevators[k];
            if (e && e.imgEl) e.imgEl.src = src;
        });
    }

    function initFlyers() {
        containerEl.flyer.innerHTML = '';
        gameState.flyers = [];
        for (let i = 0; i < CONFIG.totalFlyers; i++) {
            const floor = Math.floor(Math.random() * 5) + 1;
            let x;
            let attempts = 0;
            const minSpacing = 70;
            do {
                x = 50 + Math.random() * (CONFIG.width - 100);
                attempts++;
                if (attempts > 300) break;
            } while (
                (gameState.elevators && (
                    (gameState.elevators.A && gameState.elevators.A.floor === floor && Math.abs(x - gameState.elevators.A.x) < minSpacing) ||
                    (gameState.elevators.B && gameState.elevators.B.floor === floor && Math.abs(x - gameState.elevators.B.x) < minSpacing)
                ))
            );
            const flyerObj = { id: i, x: x, y: floor * CONFIG.floorHeight, collected: false };
            const flyerEl = document.createElement('div');
            flyerEl.className = 'flyer';
            flyerEl.id = 'flyer-' + i;
            flyerEl.style.left = x + 'px';
            flyerEl.style.bottom = (flyerObj.y + 20) + 'px';
            containerEl.flyer.appendChild(flyerEl);
            gameState.flyers.push(flyerObj);
        }

    function spawnEnemy(door) {
        const types = [
            { name: '시유키', color: '#fff', speed: 1.0, behavior: 'ladder50' },
            { name: '타로', color: '#2196f3', speed: 1.6, behavior: 'fall' },
            { name: '루나', color: '#f44336', speed: 0.8, behavior: 'noLadder' },
            { name: '미아', color: '#000', speed: 0.8, behavior: 'ladderOscillate' },
            { name: '미나미', color: '#4caf50', speed: 1.2, behavior: 'ladder100' },
            { name: '소미', color: '#ffeb3b', speed: 1.6, behavior: 'patrolDisappear' }
        ];
        const allowedNames = getAllowedEnemyNamesForStage(gameState.stage);
        const pool = Array.isArray(allowedNames) ? types.filter(t => allowedNames.includes(t.name)) : types;
        const effectivePool = pool.length > 0 ? pool : types;
        const type = effectivePool[Math.floor(Math.random() * effectivePool.length)];
        // animate door when spawning: play door_2 -> door_3 -> door_4, then restore door_1
        try {
            if (door && door.el) {
                try { door.el.src = '오브젝트(Obj)/door_2.png'; } catch(e){}
                scheduleTimeout(() => { if (door && door.el) door.el.src = '오브젝트(Obj)/door_3.png'; }, 120);
                scheduleTimeout(() => { if (door && door.el) door.el.src = '오브젝트(Obj)/door_4.png'; }, 240);
                scheduleTimeout(() => { if (door && door.el) door.el.src = '오브젝트(Obj)/door_1.png'; }, 420);
            }
        } catch(e) { console.warn('door animation failed', e); }

        const enemyEl = document.createElement('div');
        enemyEl.className = 'enemy silhouette';
        containerEl.enemy.appendChild(enemyEl);
        const enemy = {
            id: ++gameState.enemySeq,
            el: enemyEl,
            typeData: type,
            x: door.x,
            y: door.floor * CONFIG.floorHeight,
            dir: Math.random() > 0.5 ? 1 : -1,
            spawnTime: Date.now(),
            status: 'silhouette',
            active: false,
            evasionIgnoreUntil: 0,
            justSpawned: false,
            lastLadderUse: 0,
            oscillateTimer: 0,
            oscillateDir: 1,
            climbTargetY: null,
            climbStartY: null,
            climbStartTime: null,
            isClimbing: false
            ,
            // animation & image
            anim: 'idle',
            animFrame: 0,
            animTimer: Date.now(),
            img: null,
            isFallingSet: false
        };
        gameState.enemies.push(enemy);
        // if we have sprite assets for this type, show idle image immediately (silhouette will grayscale it)
        const hasImageTypes = ['루나','미나미','미아','소미','시유키','타로'];
            if (hasImageTypes.includes(type.name)) {
                let idleSrc = '';
                switch(type.name) {
                    case '루나': idleSrc = '루나(luna)/luna_idle.png'; break;
                    case '미나미': idleSrc = '미나미(minami)/minami_idle.png'; break;
                    case '미아': idleSrc = '미아(mia)/mia_idle.png'; break;
                    case '소미': idleSrc = '소미(somi)/somi_idle.png'; break;
                    case '시유키': idleSrc = '시유키(shiyuki)/shiyuki_idle.png'; break;
                    case '타로': idleSrc = '타로(taro)/taro_idle.png'; break;
                }
                if (idleSrc) {
                    enemy.el.innerHTML = '';
                    const eImg = safeCreateImage(idleSrc, 36, 48, type.name);
                    enemy.el.appendChild(eImg);
                    enemy.img = eImg;
                }
            }
            scheduleTimeout(() => {
                if (!enemy.el) return;
                enemy.status = 'revealed';
                enemy.el.classList.replace('silhouette', 'revealed');
            // if image exists keep it; otherwise show colored rectangle
            if (!enemy.img) {
                enemy.el.style.backgroundColor = type.color;
                enemy.el.innerText = type.name;
            } else {
                enemy.anim = 'idle';
                enemy.animFrame = 0;
                enemy.animTimer = Date.now();
            }
            scheduleTimeout(() => {
                if (!enemy.el) return;
                enemy.status = 'active';
                enemy.active = true;
                // keep idle for a short moment after spawning so they don't immediately play walk
                enemy.justSpawned = true;
                enemy.anim = 'idle';
                enemy.animFrame = 0;
                enemy.animTimer = Date.now();
                enemy.el.classList.replace('revealed', 'active');
                scheduleTimeout(() => { enemy.justSpawned = false; }, 1200);
            }, 1000);
        }, 2000);
    }

    function update() {
        if (gameState.isPaused) {
            requestAnimationFrame(update);
            return;
        }

        if (!gameState.isDead) {
            if (gameState.isClimbing) {
                const elapsed = Date.now() - gameState.climbStartTime;
                const progress = Math.min(elapsed / 400, 1);
                gameState.y = gameState.climbStartY + (gameState.climbTargetY - gameState.climbStartY) * progress;
                if (progress >= 1) {
                    gameState.y = gameState.climbTargetY;
                    gameState.currentFloor = Math.round(gameState.y / 100);
                    updateUI();
                    gameState.isClimbing = false;
                    gameState.climbTargetY = null;
                    gameState.climbStartY = null;
                    gameState.climbStartTime = null;
                }
            } else {
                const currentSpeed = CONFIG.baseMoveAmount * gameState.moveMultiplier;
                if (gameState.keys['ArrowRight'] || gameState.keys['d']) gameState.playerXVel += currentSpeed;
                if (gameState.keys['ArrowLeft'] || gameState.keys['a']) gameState.playerXVel -= currentSpeed;
                gameState.playerXVel *= CONFIG.friction;
                gameState.x += gameState.playerXVel;
                if (gameState.x < 0) gameState.x = 0;
                if (gameState.x > CONFIG.width - CONFIG.playerWidth) gameState.x = CONFIG.width - CONFIG.playerWidth;
                if (gameState.keys['ArrowUp'] || gameState.keys['w']) tryClimb('up');
                else if (gameState.keys['ArrowDown'] || gameState.keys['s']) tryClimb('down');
                checkElevator();
            }
        }

        updateEnemies();

        // update player animation
        updatePlayerAnimation();

        if (!gameState.isDead) {
            checkFlyerCollision();
            checkEnemyCollision();
            checkDoorSpawns();
        }

        if (gameState.y >= 500 && gameState.score === CONFIG.totalFlyers) {
            triggerStageClear();
        }

        draw();
        requestAnimationFrame(update);
    }

    function tryEnemyClimb(en, direction) {
        const enCenterX = en.x + 18;
        const ladder = gameState.ladders.find(l => {
            const inX = enCenterX > l.x && enCenterX < l.x + 40;
            if (direction === 'up') return inX && Math.abs(en.y - l.bottomY) < 20;
            else return inX && Math.abs(en.y - l.topY) < 20;
        });
        if (ladder && !en.isClimbing) {
            en.climbTargetY = direction === 'up' ? ladder.topY : ladder.bottomY;
            en.climbStartY = en.y;
            en.climbStartTime = Date.now();
            en.isClimbing = true;
            // leaving scare state when starting to climb
            en.isScaring = false;
            // snap horizontally to ladder for smooth visual
            en.x = ladder.x + 2;
            return true;
        }
        return false;
    }

    function updateEnemies() {
        const now = Date.now();
        gameState.enemies = gameState.enemies.filter(en => {
            const prevX = en.x;
            const prevY = en.y;
            if (now - en.spawnTime > 15000) { en.el.remove(); return false; }
            if (en.status === 'active') {
                if (en.isClimbing) {
                    const elapsed = Date.now() - en.climbStartTime;
                    const progress = Math.min(elapsed / 400, 1);
                    en.y = en.climbStartY + (en.climbTargetY - en.climbStartY) * progress;
                    if (progress >= 1) {
                        en.y = en.climbTargetY;
                        en.isClimbing = false;
                        en.climbTargetY = null;
                        en.climbStartY = null;
                        en.climbStartTime = null;
                        // if this enemy is Mia, enter scare state and pick a random scare frame
                        try {
                            if (en.typeData && en.typeData.name === '미아' && en.img) {
                                const n = 1 + Math.floor(Math.random() * 4);
                                en.isScaring = true;
                                en.scareFrame = n;
                                en.anim = 'catch';
                                en.animFrame = 0;
                                en.animTimer = Date.now();
                            }
                        } catch(e) { /* ignore image errors */ }
                    }
                } else {
                    switch(en.typeData.behavior) {
                        case 'ladder50':
                            en.x += en.dir * en.typeData.speed;
                                    if (en.x < 0 || en.x > CONFIG.width - 36) en.dir *= -1;
                            if (Math.random() < 0.5 && now - en.lastLadderUse > 1500) {
                                if (tryEnemyClimb(en, 'up')) { en.lastLadderUse = now; }
                                else if (tryEnemyClimb(en, 'down')) { en.lastLadderUse = now; }
                            }
                            break;
                        case 'fall':
                                    en.y -= en.typeData.speed;
                                    // if taro, set a static fall image once (no animation)
                                    if (en.typeData.name === '타로' && en.img && !en.isFallingSet) {
                                        const choice = Math.random() < 0.5 ? 1 : 2;
                                        en.img.src = `타로(taro)/taro_fall${choice}.png`;
                                        en.isFallingSet = true;
                                    }
                                    if (en.y <= 0) { en.el.remove(); return false; }
                            break;
                        case 'noLadder':
                            en.x += en.dir * en.typeData.speed;
                                    if (en.x < 0 || en.x > CONFIG.width - 36) en.dir *= -1;
                            break;
                        case 'ladderOscillate':
                            const enCenterX = en.x + 18;
                            // find ladder at this x if aligned vertically
                            const ladderObj = gameState.ladders.find(l => enCenterX > l.x && enCenterX < l.x + 40 && (Math.abs(en.y - l.bottomY) < 20 || Math.abs(en.y - l.topY) < 20));
                            if (ladderObj) {
                                // initiate a smooth climb up/down using climb fields
                                if (!en.isClimbing && (now - en.oscillateTimer > 2000)) {
                                    const targetFloorY = en.oscillateDir === 1 ? ladderObj.topY : ladderObj.bottomY;
                                    en.climbTargetY = targetFloorY;
                                    en.climbStartY = en.y;
                                    en.climbStartTime = Date.now();
                                    en.isClimbing = true;
                                    // leaving scare state when starting to climb
                                    en.isScaring = false;
                                    en.x = ladderObj.x + 2;
                                    en.oscillateDir *= -1;
                                    en.oscillateTimer = now;
                                }
                                } else {
                                en.x += en.dir * en.typeData.speed;
                                if (en.x < 0 || en.x > CONFIG.width - 36) en.dir *= -1;
                            }
                            break;
                        case 'ladder100':
                            en.x += en.dir * en.typeData.speed;
                            if (en.x < 0 || en.x > CONFIG.width - 36) en.dir *= -1;
                            if (now - en.lastLadderUse > 2000) {
                                if (tryEnemyClimb(en, 'up')) { en.lastLadderUse = now; }
                                else if (tryEnemyClimb(en, 'down')) { en.lastLadderUse = now; }
                            }
                            break;
                        case 'patrolDisappear':
                            en.x += en.dir * en.typeData.speed;
                            if (en.x < 0 || en.x > CONFIG.width - 36) en.dir *= -1;
                            if (now - en.spawnTime > 10000) { en.el.remove(); return false; }
                            break;
                        default:
                            en.x += en.dir * en.typeData.speed;
                            if (en.x < 0 || en.x > CONFIG.width - 36) en.dir *= -1;
                            break;
                    }
                }
            }

            const movedThisFrame = Math.abs(en.x - prevX) > 0.01 || Math.abs(en.y - prevY) > 0.01;
            // 1층(바닥) 이하로 내려오면 적 제거
            if (en.y <= 0) {
                en.el.remove();
                return false;
            }
            en.el.style.left = en.x + 'px';
            en.el.style.bottom = (en.y + 20) + 'px';
            // animate image frames for image-based enemies (walk/ladder/catch)
            if (en.img) {
                const aNow = Date.now();
                const typeName = en.typeData.name;
                const info = ENEMY_ANIM_INFO[typeName] || {};
                const walkInfo = info.walk || {count:0,prefix:'',dur:120};
                const ladderInfo = info.ladder || {count:0,prefix:'',dur:160};
                const catchInfo = info.catch || {count:0,prefix:'',dur:2000};
                const idleInfo = info.idle || {count:0,prefix:'',dur:400};
                const animSets = { idle: idleInfo, walk: walkInfo, ladder: ladderInfo, catch: catchInfo };
                // if taro is falling and we set static fall image, skip anim updates
                if (en.typeData.behavior === 'fall' && en.isFallingSet) {
                    en.img.style.transform = en.dir < 0 ? 'scaleX(-1)' : 'scaleX(1)';
                } else {
                    let desired = 'idle';
                    if (en.isClimbing) desired = 'ladder';
                    else if (en.typeData && en.typeData.name === '미아' && en.isScaring) desired = 'catch';
                    else if (movedThisFrame) desired = 'walk';
                    else if (en.justSpawned) desired = 'idle';
                    else if (en.status === 'active') desired = 'walk';
                    if (en.anim !== desired) { en.anim = desired; en.animFrame = 0; en.animTimer = aNow; }
                    const set = animSets[en.anim] || animSets.walk;
                    if (set.count <= 0 || !set.prefix) {
                        // no frames for this anim; only update flipping
                        en.img.style.transform = en.dir < 0 ? 'scaleX(-1)' : 'scaleX(1)';
                    } else {
                        // special-case Mia scare: show the selected scareFrame repeatedly instead of cycling
                        if (en.typeData && en.typeData.name === '미아' && en.anim === 'catch' && en.isScaring && en.scareFrame) {
                            const src = `${set.prefix}${en.scareFrame}.png`;
                            if (en.img.src.indexOf(src) === -1) en.img.src = src;
                            en.img.style.transform = en.dir < 0 ? 'scaleX(-1)' : 'scaleX(1)';
                        } else {
                            if (aNow - en.animTimer >= set.dur) { en.animFrame = (en.animFrame + 1) % Math.max(1,set.count); en.animTimer = aNow; }
                            const idx = en.animFrame + 1;
                            const src = set.count > 1 ? `${set.prefix}${idx}.png` : `${set.prefix}.png`;
                            if (en.img.src.indexOf(src) === -1) en.img.src = src;
                            en.img.style.transform = en.dir < 0 ? 'scaleX(-1)' : 'scaleX(1)';
                        }
                    }
                }
            }
            return true;
        });
    }

    function checkDoorSpawns() {
        const now = Date.now();
        gameState.doors.forEach(door => {
            // safety fallback: nextSpawnAt이 비어 있으면 3~12초 사이로 설정
            if (!door.nextSpawnAt) door.nextSpawnAt = now + randMs(3000, 12000);
            if (now >= door.nextSpawnAt) {
                spawnEnemy(door);
                // 첫 스폰 이후: 스테이지별 간격으로 스폰
                door.nextSpawnAt = now + getPostFirstDoorSpawnDelayMs(gameState.stage);
            }
        });
    }

    function showMissText() {
        const container = document.getElementById('game-container');
        if (!container) return;

        const miss = document.createElement('div');
        miss.className = 'miss-text';
        miss.textContent = 'MISS';

        const x = gameState.x + (CONFIG.playerWidth / 2);
        const y = gameState.y + CONFIG.playerHeight + 30;
        miss.style.left = x + 'px';
        miss.style.bottom = y + 'px';

        container.appendChild(miss);
        // cleanup after animation
        scheduleTimeout(() => {
            try { miss.remove(); } catch (_) {}
        }, 800);
    }

    function checkEnemyCollision() {
        if (gameState.isDead) return;
        const now = Date.now();
        const pRect = { left: gameState.x, right: gameState.x + CONFIG.playerWidth, bottom: gameState.y, top: gameState.y + CONFIG.playerHeight };
        gameState.enemies.forEach(en => {
            if (!en.active) return;
            if (en.evasionIgnoreUntil && now < en.evasionIgnoreUntil) return;
            const eRect = { left: en.x, right: en.x + 36, bottom: en.y, top: en.y + 48 };
            if (pRect.right > eRect.left && pRect.left < eRect.right && pRect.top > eRect.bottom && pRect.bottom < eRect.top) {
                if (Math.random() * 100 < gameState.evasionRate) {
                    // 회피 성공: MISS 문구 표시 + 해당 적과의 접촉 1초 무시
                    en.evasionIgnoreUntil = now + 1000;
                    showMissText();
                    return;
                }
                // 잡힘 효과음
                sound.playSeGotya();
                // unified: always immediate death on collision (no delayed "caught" state)
                if (containerEl.player) {
                    containerEl.player.innerHTML = '';
                    const overSrc = `플레이어(Player)/Player_over1.png`;
                    const overImg = safeCreateImage(overSrc, CONFIG.playerWidth, CONFIG.playerHeight, '플레이어');
                    containerEl.player.appendChild(overImg);
                }
                en.active = false;
                playerDie();
                return;
            }
        });
    }

    function playerDie() {
        if (gameState.isGameOver) return;
        gameState.isDead = true;

        // lives decrement
        gameState.lives = Math.max(0, (gameState.lives || 0) - 1);
        updateUI();

        if (gameState.lives <= 0) {
            triggerGameOver();
            return;
        }

        // show fixed Over1 image when dying
        if (containerEl.player) {
            containerEl.player.innerHTML = '';
            const overImg = safeCreateImage('플레이어(Player)/Player_over1.png', CONFIG.playerWidth, CONFIG.playerHeight, '플레이어');
            containerEl.player.appendChild(overImg);
        }
        containerEl.player.classList.add('dead');
        // schedule respawn via tracked timeout
        if (gameState.respawnTimeoutId) {
            clearTimeout(gameState.respawnTimeoutId);
            const idx = gameState.activeTimeouts.indexOf(gameState.respawnTimeoutId);
            if (idx !== -1) gameState.activeTimeouts.splice(idx, 1);
        }
        gameState.respawnTimeoutId = scheduleTimeout(() => {
            gameState.x = 100;
            gameState.y = 0;
            gameState.currentFloor = 0;
            gameState.playerXVel = 0;
            gameState.isClimbing = false;
            gameState.isDead = false;
            containerEl.player.classList.remove('dead');
            // restore default idle image on respawn
            if (containerEl.player) {
                containerEl.player.innerHTML = '';
                const pImg = safeCreateImage('플레이어(Player)/Player_idle.png', CONFIG.playerWidth, CONFIG.playerHeight, '플레이어');
                containerEl.player.appendChild(pImg);
            }
            updateUI();
            gameState.respawnTimeoutId = null;
            // 리스폰 효과음
            sound.playSeRespawn();
        }, gameState.respawnTime * 1000);
    }

    function triggerGameOver() {
        gameState.isGameOver = true;
        gameState.isPaused = true;
        gameState.isDead = true;

        // clear any pending timeouts (spawn, elevator cooldown, respawn)
        clearScheduledTimeouts();
        gameState.respawnTimeoutId = null;

        // show overlay
        const go = document.getElementById('gameover-overlay');
        if (go) go.style.display = 'flex';

        // BGM
        sound.playBgmGameover();
    }

    function returnToMainMenu() {
        // from game over screen back to main menu and reset progression
        const go = document.getElementById('gameover-overlay');
        if (go) go.style.display = 'none';
        const clear = document.getElementById('clear-overlay');
        if (clear) clear.style.display = 'none';
        const cut = document.getElementById('cutscene-overlay');
        if (cut) cut.style.display = 'none';
        const ending = document.getElementById('ending-overlay');
        if (ending) ending.style.display = 'none';
        initGame();
    }

    function tryClimb(direction) {
        const pCenterX = gameState.x + CONFIG.playerWidth / 2;
        const ladder = gameState.ladders.find(l => {
            const inX = pCenterX > l.x && pCenterX < l.x + 40;
            if (direction === 'up') return inX && Math.abs(gameState.y - l.bottomY) < 20;
            else return inX && Math.abs(gameState.y - l.topY) < 20;
        });

        if (ladder && !gameState.isClimbing) {
            gameState.climbTargetY = direction === 'up' ? ladder.topY : ladder.bottomY;
            gameState.climbStartY = gameState.y;
            gameState.climbStartTime = Date.now();
            gameState.isClimbing = true;
            gameState.x = ladder.x + 2;
            // 사다리 효과음 1/3 확률
            if (Math.random() < 1/3) sound.playSeLadder();
        }
    }

    function checkElevator() {
        if (gameState.elevatorCooldownActive) return;
        const pCenterX = gameState.x + CONFIG.playerWidth / 2;
        if (Math.abs(gameState.y - gameState.elevators.A.y) < 20 && Math.abs(pCenterX - (gameState.elevators.A.x + 25)) < 30) {
            gameState.x = gameState.elevators.B.x + 5;
            gameState.y = gameState.elevators.B.y;
            gameState.currentFloor = gameState.elevators.B.floor;
            gameState.elevatorCooldownActive = true;
            gameState.elevators.A.el.classList.add('cooldown');
            gameState.elevators.B.el.classList.add('cooldown');
            // 비활성화 상태 이미지
            setElevatorImages(false);
            // 엘리베이터 효과음
            sound.playSeDing();
            updateUI();
            scheduleTimeout(() => {
                gameState.elevatorCooldownActive = false;
                gameState.elevators.A.el.classList.remove('cooldown');
                gameState.elevators.B.el.classList.remove('cooldown');
                // 사용 가능 상태 이미지
                setElevatorImages(true);
            }, 7000);
        }
    }

    function checkFlyerCollision() {
        const pRect = { left: gameState.x, right: gameState.x + CONFIG.playerWidth, bottom: gameState.y, top: gameState.y + CONFIG.playerHeight };
        gameState.flyers.forEach(f => {
            if (!f.collected && pRect.right > f.x && pRect.left < f.x + 30 && pRect.top > f.y && pRect.bottom < f.y + 40) {
                f.collected = true;
                gameState.score++;
                document.getElementById('flyer-' + f.id).classList.add('collected');
                // 전단지 획득 효과음
                sound.playSeChack();
                updateUI();
            }
        });
    }

    function updateUI() {
        document.getElementById('score-display').innerText = `전단지: ${gameState.score} / ${CONFIG.totalFlyers}`;
        document.getElementById('level-display').innerText = `Lv. ${gameState.stage}`;
        containerEl.uiStats.innerText = `이속: ${gameState.moveMultiplier.toFixed(1)} | 회피: ${gameState.evasionRate}%`;

        if (containerEl.goalHint) {
            const shouldShowGoalHint = gameState.score >= CONFIG.totalFlyers && !gameState.stageCleared && !gameState.isGameOver;
            containerEl.goalHint.style.display = shouldShowGoalHint ? 'block' : 'none';
        }

        const livesEl = document.getElementById('lives-display');
        if (livesEl) livesEl.innerText = `목숨: ${gameState.lives} / ${gameState.maxLives}`;
    }

    function draw() {
        containerEl.player.style.left = gameState.x + 'px';
        containerEl.player.style.bottom = (gameState.y + 15) + 'px';
    }

    function updatePlayerAnimation() {
        // ensure player img exists
        const img = containerEl.player.querySelector('img');
        if (!img) return;
        if (gameState.caughtByEnemy || gameState.isDead) return; // show Over image while caught or dead
        const now = Date.now();
        const cfg = {
            walk: {count:5,prefix:'플레이어(Player)/Player_walk',dur:120},
            ladder: {count:3,prefix:'플레이어(Player)/Player_ladder',dur:160},
            idle: {count:1,prefix:'플레이어(Player)/Player_idle',dur:400}
        };
        let desired = 'idle';
        if (gameState.isClimbing) desired = 'ladder';
        else if (Math.abs(gameState.playerXVel) > 0.3 || gameState.keys['ArrowLeft'] || gameState.keys['ArrowRight'] || gameState.keys['a'] || gameState.keys['d']) desired = 'walk';
        if (gameState.playerAnim !== desired) { gameState.playerAnim = desired; gameState.playerAnimFrame = 0; gameState.playerAnimTimer = now; }
        const set = cfg[gameState.playerAnim] || cfg.walk;
        if (now - gameState.playerAnimTimer >= set.dur) { gameState.playerAnimFrame = (gameState.playerAnimFrame + 1) % Math.max(1,set.count); gameState.playerAnimTimer = now; }
        const idx = gameState.playerAnimFrame + 1;
        const src = set.count > 1 ? `${set.prefix}${idx}.png` : `${set.prefix}.png`;
        if (img.src.indexOf(src) === -1) img.src = src;
        img.style.transform = gameState.playerXVel < 0 ? 'scaleX(-1)' : 'scaleX(1)';
    }

    function resetGame() {
        document.getElementById('message').style.display = 'none';
        initGame();
    }

    window.addEventListener('keydown', e => gameState.keys[e.key] = true);
    window.addEventListener('keyup', e => gameState.keys[e.key] = false);

    initGame();
    update();
</script>
</body>
</html>
